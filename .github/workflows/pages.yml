name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build for the repository sub-path
        env:
          # Served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # The static Pages site has no API of its own, so it calls the
          # separately hosted API here. Same-origin when the API serves the SPA.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://marketplaceos-api.onrender.com' }}
        run: npm run build
      - name: Add SPA fallback
        # GitHub Pages has no catch-all rewrite, so any client-side route
        # (/vendors/3, /login, ...) is served as a 404 unless a 404.html
        # exists. Copying the shell over it works because assets are absolute
        # and the router reads the requested path.
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
