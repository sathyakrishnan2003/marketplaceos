# Render.com blueprint for the MarketplaceOS API (free plan, no card required).
#
# The frontend is published separately to GitHub Pages
# (https://sathyakrishnan2003.github.io/marketplaceos), so this service only
# needs to build and run the Node API. Keeping the build to one npm project
# makes it fast and gives it a single, small failure surface.
#
# The database is NOT declared here: Render's only free database is Postgres and
# it expires after 30 days, so the API is pointed at an external free MySQL
# instance (Aiven). Create that first, then paste the credentials into the DB_*
# variables when Render prompts for them (marked "sync: false").
#
#   1. aiven.io -> create a free MySQL service (1 GB) -> note host/port/user/password/db
#   2. dashboard.render.com -> New + -> Blueprint -> this repo
#   3. fill in the DB_* values -> Apply
#   4. from your machine: npm run db:migrate && npm run db:seed
#
# The same source also supports a single-host deploy, where Express serves the
# built SPA itself: see railway.toml and the Dockerfile at the repo root.

services:
  - type: web
    name: marketplaceos-api
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # The SPA is served from GitHub Pages, so the browser treats it as a
      # different origin. This is the origin only (no path, no trailing slash).
      - key: CORS_ORIGIN
        value: "https://sathyakrishnan2003.github.io"
      # The free plan has no shell, so the service applies the schema and seeds
      # demo data itself on first boot. Set to "false" to manage them manually.
      - key: AUTO_MIGRATE
        value: "true"
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: RATE_LIMIT_GENERAL_MAX
        value: "300"
