# Render.com blueprint for the MarketplaceOS API (free plan, no card required).
#
# The database is NOT declared here: Render only offers a free Postgres (which
# expires after 30 days), so the API is pointed at an external Aiven free MySQL
# instance instead. Create that first, then paste the credentials into the
# DB_* variables when Render prompts for them (marked "sync: false").
#
#   1. aiven.io -> create a free MySQL service (1 GB) -> note host/port/user/password/db
#   2. dashboard.render.com/yaml/new -> paste this repo URL
#   3. fill in the DB_* values, deploy
#   4. from your machine: npm run db:migrate && npm run db:seed

services:
  - type: web
    name: marketplaceos-api
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # PORT is assigned by Render automatically; do not override it.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: RATE_LIMIT_GENERAL_MAX
        value: "300"
